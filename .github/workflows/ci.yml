name: CI

# Corre en PR y en push sin ningún secreto: build, tests con cobertura, gate de licencias, smoke del consumidor mínimo y pack.
on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: 'Release'
  HUSKY: '0'
  # Cobertura mínima de líneas del equipo.
  MIN_COVERAGE: '60'

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test eng scripts
        run: python3 -m unittest discover -s eng -p 'test_*.py'

      # Cada paquete con cambios en src/<PackageId>/ o en las props compartidas sube su <Version>.
      - name: Version bump guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 eng/check-version-bump.py "$BASE_SHA" HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ElRoso.Commons.sln

      - name: License gate
        run: python3 eng/license-gate.py src/*/*.csproj

      - name: Build
        run: dotnet build ElRoso.Commons.sln -c "$CONFIGURATION" --no-restore

      - name: Test with coverage
        run: |
          dotnet test Tests/ElRoso.Commons.Tests.csproj \
            -c "$CONFIGURATION" \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Compute coverage
        id: coverage
        run: |
          set -euo pipefail
          COVERAGE_FILE=$(find ./TestResults -name 'coverage.cobertura.xml' | head -n 1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "::error::Coverage file not found"
            exit 1
          fi
          export COVERAGE_FILE
          COVERAGE=$(python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse(os.environ['COVERAGE_FILE']).getroot()
          total = covered = 0
          for cls in root.iter('class'):
              if '/obj/' in cls.get('filename', ''):
                  continue
              for line in cls.iter('line'):
                  total += 1
                  covered += int(line.get('hits', '0')) > 0
          print(f"{(covered / total * 100) if total else 0:.2f}")
          sys.stderr.write(f"Lines covered: {covered}/{total}\n")
          PY
          )
          echo "value=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "## Code coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "Minimum required: ${MIN_COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum coverage
        env:
          COV: ${{ steps.coverage.outputs.value }}
        run: |
          awk -v c="$COV" -v m="$MIN_COVERAGE" 'BEGIN { exit !(c+0 >= m+0) }' || {
            echo "::error::Coverage $COV% is below minimum $MIN_COVERAGE%"
            exit 1
          }
          echo "Coverage $COV% meets minimum $MIN_COVERAGE%"

      # El consumidor mínimo (Core + AspNetCore + Serilog + EntityFrameworkCore) no arrastra SDKs de terceros.
      - name: Smoke samples/Minimal
        run: |
          set -euo pipefail
          output=$(dotnet list samples/Minimal/Minimal.csproj package --include-transitive)
          printf '%s\n' "$output"
          hits=$(printf '%s\n' "$output" | grep -E -i 'mongodb|sqlclient|identity\.web|microsoft\.graph|awssdk|azure\.|polly|windowsservices|bouncycastle' || true)
          if [ -n "$hits" ]; then
            echo "::error::samples/Minimal arrastra dependencias que no corresponden a los paquetes base."
            printf '%s\n' "$hits"
            exit 1
          fi

      # Verifica que los documentos OpenAPI generados sean consumibles como tipos TypeScript.
      - name: Smoke OpenAPI a TypeScript
        run: |
          set -euo pipefail
          docs=$(ls samples/OpenApi/openapi/*.json)
          for doc in $docs; do
            out="$RUNNER_TEMP/$(basename "$doc" .json).d.ts"
            npx --yes openapi-typescript@7.13.0 "$doc" -o "$out"
            grep -q "export interface paths" "$out"
          done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 14

  # Empaqueta los 16 paquetes con la versión de cada csproj y verifica licencia, readme, repositorio y símbolos.
  pack-verify:
    name: Verify NuGet pack
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack
        run: dotnet pack ElRoso.Commons.sln -c "$CONFIGURATION" --output ./nupkg

      - name: Verify packages
        run: python3 eng/verify-pack.py ./nupkg --all

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-preview
          path: ./nupkg/*.*nupkg
          retention-days: 7
